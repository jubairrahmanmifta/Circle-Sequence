<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Circle Sequence Game</title>
<style>
:root{--bg:#f4f5f9;--card:#fff;--text:#1d2033;--muted:#6b7089;--border:#dfe2ee;--accent:#5b5bd6;--hid:#8a8fd8;--hid2:#6a6fc4;--ok:#2fa866;--bad:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14151f;--card:#1e2030;--text:#eceefa;--muted:#9aa0bd;--border:#33364d;--accent:#8b8bf0;--hid:#4a4e9a;--hid2:#383c80;--ok:#3ecf80;--bad:#ff6b70}}
:root[data-theme="dark"]{--bg:#14151f;--card:#1e2030;--text:#eceefa;--muted:#9aa0bd;--border:#33364d;--accent:#8b8bf0;--hid:#4a4e9a;--hid2:#383c80;--ok:#3ecf80;--bad:#ff6b70}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}
label{display:block;font-weight:600;margin-bottom:10px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1px solid var(--border);background:transparent;color:var(--text);padding:10px 18px;border-radius:10px;font-size:1rem;cursor:pointer}
.opt.on{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.big{font-size:1.4rem;font-weight:700;color:var(--accent)}
.btn{background:var(--accent);color:#fff;border:0;padding:13px 22px;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border);width:auto;padding:8px 14px;font-size:.9rem}
.players{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pl{flex:1;min-width:110px;border:2px solid var(--border);border-radius:12px;padding:8px 10px;background:var(--card)}
.pl.turn{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.pl b{display:block;font-size:.95rem}
.pl span{font-size:.8rem;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.status{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.msg{font-weight:600}
.board{position:relative;width:100%;height:min(70vh,520px);background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.c{position:absolute;border-radius:50%;cursor:pointer;perspective:600px;transition:transform .1s}
.c:active{transform:scale(.95)}
.in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s}
.c.flip .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;font-weight:700}
.f{background:radial-gradient(circle at 30% 30%,var(--hid),var(--hid2));border:2px solid var(--hid2)}
.b{background:var(--card);border:3px solid var(--ok);color:var(--text);transform:rotateY(180deg);font-size:calc(var(--s)*.42)}
.c.wrong .b{border-color:var(--bad);color:var(--bad)}
.c.done{cursor:default}
.overlay{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 85%,transparent);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:20px}
.overlay.show{display:flex}
.overlay h2{margin:0;font-size:1.6rem}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Circle Sequence</h1>
  <p class="sub">Find the circles in order, 1, 2, 3 … Break the sequence and the next player starts over from 1.</p>

  <div id="setup">
    <div class="card">
      <label>Number of players</label>
      <div class="opts" id="pOpts"></div>
    </div>
    <div class="card">
      <label>Number of circles: <span class="big" id="nVal">8</span></label>
      <input type="range" id="n" min="3" max="20" value="8">
    </div>
    <button class="btn" id="start">Start game</button>
  </div>

  <div id="game" class="hide">
    <div class="players" id="players"></div>
    <div class="status">
      <div class="msg" id="msg"></div>
      <button class="btn ghost" id="quit">New game</button>
    </div>
    <div class="board" id="board">
      <div class="overlay" id="over">
        <h2 id="winTxt"></h2>
        <button class="btn" style="max-width:220px" id="again">Play again</button>
      </div>
    </div>
  </div>
</div>

<script>
const COLORS=['#5b5bd6','#e5484d','#2fa866','#e08a00'];
let P=2,N=8,cur=0,next=1,lock=false,over=false,best=[],wins=[];
const $=id=>document.getElementById(id);

const pOpts=$('pOpts');
[1,2,3,4].forEach(k=>{
  const b=document.createElement('button');
  b.className='opt'+(k===P?' on':'');b.textContent=k+(k===1?' player':' players');
  b.onclick=()=>{P=k;[...pOpts.children].forEach((c,i)=>c.classList.toggle('on',i+1===k))};
  pOpts.appendChild(b);
});
$('n').oninput=e=>{N=+e.target.value;$('nVal').textContent=N};
$('start').onclick=()=>{$('setup').classList.add('hide');$('game').classList.remove('hide');newGame(true)};
$('quit').onclick=()=>{$('game').classList.add('hide');$('setup').classList.remove('hide')};
$('again').onclick=()=>newGame(false);

function newGame(reset){
  cur=0;next=1;lock=false;over=false;
  best=Array(P).fill(0);
  if(reset||wins.length!==P)wins=Array(P).fill(0);
  $('over').classList.remove('show');
  buildBoard();renderPlayers();setMsg();
}

function buildBoard(){
  const board=$('board');
  board.querySelectorAll('.c').forEach(e=>e.remove());
  const W=board.clientWidth,H=board.clientHeight;
  const size=Math.max(38,Math.min(84,Math.floor(Math.sqrt(W*H/N/2.6))));
  const pos=[];
  for(let i=0;i<N;i++){
    let ok=false,x,y,tries=0,s=size;
    while(!ok){
      x=6+Math.random()*(W-s-12);y=6+Math.random()*(H-s-12);
      ok=pos.every(p=>Math.hypot(p.x-x,p.y-y)>s+6);
      if(++tries>600){s=Math.max(30,s-4);tries=0;}
    }
    pos.push({x,y,s});
  }
  const nums=[...Array(N)].map((_,i)=>i+1).sort(()=>Math.random()-.5);
  nums.forEach((num,i)=>{
    const {x,y,s}=pos[i];
    const d=document.createElement('div');
    d.className='c';d.dataset.n=num;
    d.style.cssText=`left:${x}px;top:${y}px;width:${s}px;height:${s}px;--s:${s}px`;
    d.innerHTML='<div class="in"><div class="f"></div><div class="b">'+num+'</div></div>';
    d.onclick=()=>pick(d);
    board.appendChild(d);
  });
}

function pick(el){
  if(lock||over||el.classList.contains('flip'))return;
  const num=+el.dataset.n;
  el.classList.add('flip');
  if(num===next){
    el.classList.add('done');
    best[cur]=Math.max(best[cur],next);
    next++;
    if(next>N){win();return}
    renderPlayers();setMsg();
  }else{
    el.classList.add('wrong');
    lock=true;
    $('msg').textContent=`${name(cur)} picked ${num} but needed ${next}. Sequence broken!`;
    setTimeout(()=>{
      document.querySelectorAll('.c').forEach(c=>c.classList.remove('flip','wrong','done'));
      next=1;cur=(cur+1)%P;lock=false;
      renderPlayers();setMsg();
    },1500);
  }
}

function win(){
  over=true;wins[cur]++;
  renderPlayers();
  $('winTxt').textContent=`🎉 ${name(cur)} wins!`;
  $('over').classList.add('show');
  $('msg').textContent='Sequence complete!';
}

const name=i=>P===1?'You':'Player '+(i+1);
function setMsg(){$('msg').textContent=`${name(cur)}, find circle ${next}`}
function renderPlayers(){
  const box=$('players');box.innerHTML='';
  for(let i=0;i<P;i++){
    const d=document.createElement('div');
    d.className='pl'+(i===cur&&!over?' turn':'');
    d.innerHTML=`<b><i class="dot" style="background:${COLORS[i]}"></i>${name(i)}${i===cur&&!over?' ◀':''}</b><span>Best streak: ${best[i]} · Wins: ${wins[i]}</span>`;
    box.appendChild(d);
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Circle Sequence Online</title>
<style>
:root{--bg:#f4f5f9;--card:#fff;--text:#1d2033;--muted:#6b7089;--border:#dfe2ee;--accent:#5b5bd6;--hid:#8a8fd8;--hid2:#6a6fc4;--ok:#2fa866;--bad:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14151f;--card:#1e2030;--text:#eceefa;--muted:#9aa0bd;--border:#33364d;--accent:#8b8bf0;--hid:#4a4e9a;--hid2:#383c80;--ok:#3ecf80;--bad:#ff6b70}}
:root[data-theme="dark"]{--bg:#14151f;--card:#1e2030;--text:#eceefa;--muted:#9aa0bd;--border:#33364d;--accent:#8b8bf0;--hid:#4a4e9a;--hid2:#383c80;--ok:#3ecf80;--bad:#ff6b70}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px}
h1{font-size:1.5rem;margin:0 0 4px}
h3{margin:0 0 10px;font-size:1.05rem}
.sub{color:var(--muted);margin:0 0 18px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}
label{display:block;font-weight:600;margin-bottom:10px}
.opts,.row{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1px solid var(--border);background:transparent;color:var(--text);padding:10px 16px;border-radius:10px;font-size:1rem;cursor:pointer}
.opt.on{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=text]{flex:1;min-width:120px;padding:11px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:1rem}
.big{font-size:1.3rem;font-weight:700;color:var(--accent)}
.btn{background:var(--accent);color:#fff;border:0;padding:12px 20px;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border);padding:8px 14px;font-size:.9rem}
.code{font-size:2.2rem;letter-spacing:.3em;font-weight:800;color:var(--accent);margin:4px 0 8px}
.players{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pl{flex:1;min-width:120px;border:2px solid var(--border);border-radius:12px;padding:8px 10px;background:var(--card)}
.pl.turn{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.pl b{display:block;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl span{font-size:.8rem;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.status{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.msg{font-weight:600}
.note{color:var(--muted);font-size:.9rem;margin-top:8px}
.board{position:relative;width:100%;aspect-ratio:10/7;container-type:inline-size;background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.c{position:absolute;aspect-ratio:1;border-radius:50%;cursor:pointer;perspective:600px}
.c:active{transform:scale(.95)}
.in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s}
.c.flip .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;font-weight:700}
.f{background:radial-gradient(circle at 30% 30%,var(--hid),var(--hid2));border:2px solid var(--hid2)}
.b{background:var(--card);border:3px solid var(--ok);color:var(--text);transform:rotateY(180deg);font-size:var(--f)}
.c.wrong .b{border-color:var(--bad);color:var(--bad)}
.c.done{cursor:default}
.overlay{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 85%,transparent);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:20px;z-index:5}
.overlay.show{display:flex}
.overlay h2{margin:0;font-size:1.5rem}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Circle Sequence</h1>
  <p class="sub">Find the circles in order, 1, 2, 3 … Break the sequence and the next player starts over from 1.</p>

  <!-- HOME -->
  <div id="home">
    <div class="card">
      <label for="nick">Your name</label>
      <div class="row"><input type="text" id="nick" maxlength="12" placeholder="Player"></div>
    </div>
    <div class="card">
      <h3>Play on this device</h3>
      <label>Players</label>
      <div class="opts" id="pOpts"></div>
      <label style="margin-top:14px">Circles: <span class="big" id="nVal">8</span></label>
      <input type="range" id="n" min="3" max="20" value="8">
      <button class="btn" id="startLocal" style="margin-top:12px">Start game</button>
    </div>
    <div class="card">
      <h3>Play online</h3>
      <div class="row">
        <button class="btn" id="create" disabled>Create room</button>
      </div>
      <div class="row" style="margin-top:12px">
        <input type="text" id="codeIn" maxlength="5" placeholder="Room code" style="text-transform:uppercase">
        <button class="btn" id="join" disabled>Join</button>
      </div>
      <div class="note" id="onNote">Checking online availability…</div>
    </div>
  </div>

  <!-- LOBBY -->
  <div id="lobby" class="hide">
    <div class="card">
      <div class="note">Room code</div>
      <div class="code" id="lobCode"></div>
      <button class="btn ghost" id="copy">Copy code</button>
      <div class="note">Share this code. Up to 4 players can join.</div>
    </div>
    <div class="card">
      <h3>Players</h3>
      <div class="players" id="lobPlayers"></div>
      <div id="hostCtl" class="hide">
        <label>Circles: <span class="big" id="nVal2">8</span></label>
        <input type="range" id="n2" min="3" max="20" value="8">
        <button class="btn" id="startOnline" style="margin-top:12px">Start game</button>
      </div>
      <div class="note" id="lobNote"></div>
    </div>
    <button class="btn ghost" id="leave1">Leave room</button>
  </div>

  <!-- GAME -->
  <div id="game" class="hide">
    <div class="players" id="players"></div>
    <div class="status">
      <div class="msg" id="msg"></div>
      <button class="btn ghost" id="leave2">Leave</button>
    </div>
    <div class="board" id="board">
      <div class="overlay" id="over">
        <h2 id="winTxt"></h2>
        <button class="btn" id="again">Play again</button>
        <div class="note" id="overNote"></div>
      </div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const COLORS=['#5b5bd6','#e5484d','#2fa866','#e08a00'];
let roomCap=null,room=null,S=null,isHost=false,hostPeer=null,code='',timers=[],unsubs=[],P=2,tout=null;

/* ---------- helpers ---------- */
const clean=s=>String(s||'').replace(/[^\p{L}\p{N} _.-]/gu,'').trim().slice(0,12);
const myName=()=>clean($('nick').value);
const getMe=()=>{const p=room&&room.peers().find(p=>p.sameTab);return p?p.peer:null};
const genCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<5;i++)c+=a[Math.floor(Math.random()*a.length)];return c};
const show=v=>['home','lobby','game'].forEach(x=>$(x).classList.toggle('hide',x!==v));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- home ---------- */
const pOpts=$('pOpts');
[1,2,3,4].forEach(k=>{
  const b=document.createElement('button');
  b.className='opt'+(k===P?' on':'');b.textContent=k+(k===1?' player':' players');
  b.onclick=()=>{P=k;[...pOpts.children].forEach((c,i)=>c.classList.toggle('on',i+1===k))};
  pOpts.appendChild(b);
});
$('n').oninput=e=>$('nVal').textContent=e.target.value;
$('n2').oninput=e=>{$('nVal2').textContent=e.target.value;};

(async()=>{
  try{roomCap=window.claude&&await claude.use('room')}catch(e){}
  if(roomCap){$('create').disabled=false;$('join').disabled=false;$('onNote').textContent='Everyone needs to open this page while signed in, with permission to interact.'}
  else $('onNote').textContent='Online rooms are not available in this view. Open the published page while signed in to claude.ai. Local play still works.';
})();

/* ---------- state ---------- */
function newState(local){
  return {phase:'lobby',local,N:8,players:[],circles:[],rev:[],flash:null,cur:0,next:1,best:[],wins:[],lock:false,round:0,code:local?'':code,host:null};
}
function gen(N){
  const W=1000,H=700;let s=Math.max(60,Math.min(140,Math.floor(Math.sqrt(W*H/N/2.6))));
  const pos=[];
  for(let i=0;i<N;i++){
    let ok=false,t=0,x,y;
    while(!ok){x=6+Math.random()*(W-s-12);y=6+Math.random()*(H-s-12);ok=pos.every(p=>Math.hypot(p[0]-x,p[1]-y)>s+6);if(++t>600){s=Math.max(30,s-4);t=0}}
    pos.push([Math.round(x),Math.round(y)]);
  }
  const nums=shuffle([...Array(N)].map((_,i)=>i+1));
  return pos.map((p,i)=>[nums[i],p[0],p[1],s]);
}
function pushState(){
  if(!S)return;
  if(isHost&&!S.local&&room){
    const m=getMe();
    if(m){S.host=m;room.emit('state',S).catch(()=>{})}
  }
  render();
}
function startRound(){
  const k=S.players.length;
  S.circles=gen(S.N);S.rev=[];S.flash=null;S.cur=0;S.next=1;S.lock=false;
  S.best=Array(k).fill(0);if(S.wins.length!==k)S.wins=Array(k).fill(0);
  S.phase='play';S.round++;pushState();
}

/* ---------- local ---------- */
$('startLocal').onclick=()=>{
  isHost=true;room=null;S=newState(true);
  const nm=myName();
  S.players=[...Array(P)].map((_,i)=>({id:'L'+i,name:P===1?(nm||'You'):(i===0&&nm?nm:'Player '+(i+1))}));
  S.wins=Array(P).fill(0);S.N=+$('n').value;
  startRound();
};

/* ---------- online ---------- */
async function enter(c){
  code=c;
  try{room=await roomCap.join('cs-'+c.toLowerCase())}catch(e){$('onNote').textContent='Could not join the room ('+(e.code||'error')+').';return false}
  unsubs.push(room.on('state',onState),room.on('join',onJoin),room.on('pick',onPick),room.onPeers(onPeers));
  return true;
}
$('create').onclick=async()=>{
  if(!roomCap)return;
  if(!await enter(genCode()))return;
  isHost=true;S=newState(false);S.N=+$('n2').value;
  timers.push(setInterval(()=>pushState(),4000));
  ensureHost();pushState();
};
$('join').onclick=async()=>{
  const c=$('codeIn').value.toUpperCase().trim();
  if(!roomCap||c.length<4){$('onNote').textContent='Enter the room code first.';return}
  if(!await enter(c))return;
  isHost=false;S=null;hostPeer=null;
  show('lobby');$('lobCode').textContent=c;$('lobNote').textContent='Joining…';
  const hello=()=>{const m=getMe();if(m&&!(S&&S.players.some(p=>p.id===m)))room.emit('join',{name:myName()}).catch(()=>{})};
  timers.push(setInterval(hello,2000));setTimeout(hello,600);
};
function ensureHost(){
  const m=getMe();
  if(isHost&&!S.local&&m&&!S.players.some(p=>p.id===m)&&S.players.length<4){
    S.players.push({id:m,name:myName()||'Host'});pushState();
  }
}
function onJoin(msg){
  if(!isHost||S.local||S.phase!=='lobby')return;
  if(S.players.length>=4||S.players.some(p=>p.id===msg.peer))return;
  const d=msg.data||{};
  S.players.push({id:msg.peer,name:clean(d.name)||'Player '+(S.players.length+1)});
  pushState();
}
function onPick(msg){
  if(!isHost||S.local||S.phase!=='play')return;
  const p=S.players[S.cur];
  if(!p||p.id!==msg.peer||!msg.data)return;
  applyPick(+msg.data.n);
}
function onState(msg){
  if(isHost)return;
  const d=msg.data;
  if(!d||d.code!==code||!d.host||d.host!==msg.peer)return;
  if(hostPeer&&hostPeer!==d.host)return;
  hostPeer=d.host;S=d;render();
}
function onPeers(ch){
  if(isHost){
    ensureHost();
    const here=new Set(room.peers().map(p=>p.peer));
    const gone=S.players.map((p,i)=>here.has(p.id)?-1:i).filter(i=>i>=0);
    if(gone.length&&getMe()){
      gone.reverse().forEach(i=>{S.players.splice(i,1);S.best.splice(i,1);S.wins.splice(i,1)});
      if(S.phase==='play'){S.rev=[];S.flash=null;S.next=1;S.lock=false;if(!S.players.length)S.phase='lobby';else S.cur%=S.players.length}
      pushState();
    }else if(ch.joined.length)pushState();
  }else render();
}

/* ---------- game logic (host only) ---------- */
function applyPick(n){
  if(S.phase!=='play'||S.lock||S.rev.includes(n)||!S.circles.some(c=>c[0]===n))return;
  if(n===S.next){
    S.rev.push(n);S.best[S.cur]=Math.max(S.best[S.cur]||0,n);S.next++;
    if(S.next>S.N){S.phase='over';S.wins[S.cur]=(S.wins[S.cur]||0)+1}
  }else{
    S.flash=n;S.lock=true;
    clearTimeout(tout);
    tout=setTimeout(()=>{
      S.rev=[];S.flash=null;S.next=1;S.cur=(S.cur+1)%S.players.length;S.lock=false;pushState();
    },1500);
  }
  pushState();
}
function myTurn(){
  if(!S||S.phase!=='play'||S.lock)return false;
  if(S.local)return true;
  const m=getMe();return !!m&&S.players[S.cur]&&S.players[S.cur].id===m;
}
function tryPick(n){
  if(!myTurn()||S.rev.includes(n))return;
  if(isHost)applyPick(n);else room.emit('pick',{n}).catch(()=>{});
}

/* ---------- buttons ---------- */
$('startOnline').onclick=()=>{if(!isHost||!S.players.length)return;S.N=+$('n2').value;startRound()};
$('again').onclick=()=>{
  if(!isHost)return;
  if(S.local){startRound()}else{S.phase='lobby';S.rev=[];S.flash=null;pushState()}
};
$('copy').onclick=()=>{try{navigator.clipboard.writeText(code)}catch(e){}$('copy').textContent='Copied';setTimeout(()=>$('copy').textContent='Copy code',1500)};
function leave(){
  timers.forEach(clearInterval);timers=[];clearTimeout(tout);
  unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];
  if(room){room.leave().catch(()=>{});room=null}
  S=null;isHost=false;hostPeer=null;code='';show('home');
}
$('leave1').onclick=leave;$('leave2').onclick=leave;

/* ---------- render ---------- */
function playerBar(el,turnIdx,showTurn){
  el.innerHTML='';
  const m=getMe();
  S.players.forEach((p,i)=>{
    const d=document.createElement('div');
    d.className='pl'+(showTurn&&i===turnIdx?' turn':'');
    const b=document.createElement('b');
    const dot=document.createElement('i');dot.className='dot';dot.style.background=COLORS[i%4];
    b.appendChild(dot);
    b.appendChild(document.createTextNode(p.name+(!S.local&&p.id===m?' (you)':'')+(showTurn&&i===turnIdx?' ◀':'')));
    d.appendChild(b);
    const sp=document.createElement('span');
    sp.textContent='Best streak: '+(S.best[i]||0)+' · Wins: '+(S.wins[i]||0);
    d.appendChild(sp);el.appendChild(d);
  });
}
function render(){
  if(!S)return;
  if(S.phase==='lobby'&&!S.local){
    show('lobby');
    $('lobCode').textContent=S.code;
    playerBar($('lobPlayers'),0,false);
    $('hostCtl').classList.toggle('hide',!isHost);
    $('lobNote').textContent=isHost?'Waiting for players. Start whenever you are ready.':'Waiting for the host to start…';
    const m=getMe();
    if(!isHost&&m&&!S.players.some(p=>p.id===m))$('lobNote').textContent='Room is full or already playing. You can watch once the game starts.';
    return;
  }
  show('game');
  playerBar($('players'),S.cur,S.phase==='play');
  const cur=S.players[S.cur];
  let t='';
  if(S.phase==='over')t='Sequence complete!';
  else if(S.lock&&S.flash)t=cur.name+' picked '+S.flash+' but needed '+S.next+'. Sequence broken!';
  else if(cur)t=(myTurn()?(S.local?cur.name+', find':'Your turn: find'):cur.name+' is finding')+' circle '+S.next;
  $('msg').textContent=t;
  if(!S.local&&!isHost&&hostPeer&&!room.peers().some(p=>p.peer===hostPeer))$('msg').textContent='The host left the room.';
  renderBoard();
  const ov=$('over');ov.classList.toggle('show',S.phase==='over');
  if(S.phase==='over'){
    $('winTxt').textContent='🎉 '+cur.name+' wins!';
    $('again').classList.toggle('hide',!isHost);
    $('overNote').textContent=isHost?'':'Waiting for the host…';
  }
}
function renderBoard(){
  const b=$('board'),key=S.round+':'+(S.code||'L');
  if(b.dataset.r!==key){
    b.dataset.r=key;b.querySelectorAll('.c').forEach(e=>e.remove());
    S.circles.forEach(([n,x,y,s])=>{
      const d=document.createElement('div');
      d.className='c';d.dataset.n=n;
      d.style.cssText='left:'+(x/10)+'%;top:'+(y/7)+'%;width:'+(s/10)+'%;--f:'+(s/10*.42)+'cqw';
      d.innerHTML='<div class="in"><div class="f"></div><div class="b">'+n+'</div></div>';
      d.onclick=()=>tryPick(n);
      b.appendChild(d);
    });
  }
  b.querySelectorAll('.c').forEach(d=>{
    const n=+d.dataset.n,w=S.flash===n,r=S.rev.includes(n);
    d.classList.toggle('flip',r||w);d.classList.toggle('wrong',w);d.classList.toggle('done',r);
  });
}
</script>
</body>
</html>
